<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil complet — BéninFreelance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{fontFamily:{syne:['Syne','sans-serif']},colors:{bg:'#0A0A0F',surface:'#13131A',surface2:'#1C1C27',brd:'#2A2A3D',accent:'#F5A623',tx:'#F0EDE8',muted:'#7A7A9A'}}}};</script>
  <style>body{font-family:'DM Sans',sans-serif}</style>
</head>
<body class="bg-bg text-tx min-h-screen">
  <header class="border-b border-brd bg-surface/80 backdrop-blur-sm sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs">
        <a id="back-teaser" href="/dashboard/client" class="text-muted hover:text-accent transition-colors">← Aperçu profil</a>
        <a href="/dashboard/client" class="text-muted hover:text-accent transition-colors">Recherche</a>
      </div>
      <span id="hdr-badge" class="text-[11px] text-muted uppercase tracking-wide">Profil</span>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div id="root"></div>
  </main>

  <script>
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s===null||s===undefined?'':String(s);return d.innerHTML;}
    function initials(p,n){return ((p&&p[0]?p[0]:'')+(n&&n[0]?n[0]:'')).toUpperCase()||'?';}
    function getId(){const m=location.pathname.match(/\/prestataires\/(\d+)\/profil/);return m?m[1]:null;}
    function serviceBlocks(services, opts){
      opts=opts||{};
      var pid=opts.prestataireId;
      var showMsg=!!opts.showMessage;
      if(!services||!services.length)return '<p class="text-sm text-muted">Aucun service publié.</p>';
      return services.map(function(s){
        const prix=s.prix_indicatif!=null?Number(s.prix_indicatif).toLocaleString('fr-FR')+' F':'Sur devis';
        const desc=s.description_excerpt||s.description||'';
        const img=s.photo_url?'<img src="'+escapeHtml(s.photo_url)+'" alt="" class="w-full h-36 object-cover rounded-lg border border-brd mb-3" loading="lazy"/>':'';
        const detail=s.detail_url||('/service/'+s.id);
        const msg=showMsg&&s.id&&pid?'<a href="/contact/prestataire/'+encodeURIComponent(String(pid))+'?service='+encodeURIComponent(String(s.id))+'" class="inline-flex items-center justify-center rounded-xl border border-accent/50 text-accent font-syne font-bold text-xs px-4 py-2 hover:bg-accent/10 transition-colors">Contacter</a>':'';
        const view='<a href="'+escapeHtml(detail)+'" class="inline-flex items-center justify-center rounded-xl bg-accent/90 text-bg font-syne font-bold text-xs px-4 py-2 hover:opacity-90">Voir le service</a>';
        const actions='<div class="mt-4 flex flex-wrap gap-2">'+view+(msg||'')+'</div>';
        return '<article class="border border-brd rounded-xl p-5 bg-surface2">'+img+
          '<h3 class="font-syne font-bold text-base mb-1">'+escapeHtml(s.titre)+'</h3>'+
          '<p class="text-xs text-muted mb-3">'+escapeHtml(s.categorie||'')+(s.delai_execution?' · '+escapeHtml(s.delai_execution):'')+' · '+escapeHtml(prix)+'</p>'+
          '<p class="text-sm leading-relaxed text-tx/90 whitespace-pre-wrap">'+escapeHtml(desc)+'</p>'+actions+'</article>';
      }).join('');
    }
    function layoutHero(p, photoHtml){
      const note=Number(p.note_moyenne||0).toFixed(1).replace('.',',');
      const nb=p.nb_avis!=null?p.nb_avis:0;
      const rating=nb>0?note+' · '+nb+' avis':note+' · pas encore d’avis';
      return '<div class="flex flex-col sm:flex-row gap-6 sm:gap-8 mb-8 pb-8 border-b border-brd">'+photoHtml+
        '<div class="min-w-0 flex-1">'+
        '<h1 class="font-syne font-bold text-2xl sm:text-3xl mb-2">'+escapeHtml((p.prenom||'')+' '+(p.nom||''))+'</h1>'+
        '<p class="text-sm text-muted mb-2">'+escapeHtml(p.localite||'')+'</p>'+
        '<p class="text-sm text-tx/90 mb-4">'+escapeHtml(rating)+'</p>'+
        '<p class="text-sm leading-relaxed text-tx/85 whitespace-pre-wrap">'+escapeHtml(p.biographie||'')+'</p></div></div>';
    }
    function starRow(note){
      const n=Math.max(0,Math.min(5,Number(note)||0));
      let html='';
      for(let i=1;i<=5;i++){
        html += i<=n
          ? '<i class="fa-solid fa-star text-accent text-[12px]"></i>'
          : '<i class="fa-regular fa-star text-muted/60 text-[12px]"></i>';
      }
      return html;
    }
    function formatDate(d){
      if(!d)return '';
      try{
        const dt=new Date(d);
        if(isNaN(dt.getTime()))return '';
        return dt.toLocaleDateString('fr-FR',{year:'numeric',month:'short',day:'numeric'});
      }catch(e){return '';}
    }
    function avisCard(a){
      const stars=starRow(a.note);
      const date=formatDate(a.created_at);
      const tag=a.commande_titre
        ?'<span class="ml-2 inline-block text-[11px] px-2 py-0.5 rounded-full bg-accent/10 text-accent/90 align-middle">'+escapeHtml(a.commande_titre)+'</span>':'';
      const body=a.commentaire
        ?'<p class="text-sm leading-relaxed text-tx/90 mt-2 whitespace-pre-wrap">'+escapeHtml(a.commentaire)+'</p>'
        :'<p class="text-xs text-muted italic mt-2">Le client n\u2019a pas laissé de commentaire.</p>';
      return '<article class="border border-brd rounded-xl p-4 bg-surface2">'+
        '<div class="flex items-center justify-between flex-wrap gap-2">'+
        '<div class="flex items-center gap-2"><div class="flex items-center gap-0.5">'+stars+'</div>'+
        '<span class="text-xs text-muted">'+escapeHtml(date)+'</span></div>'+
        '<div class="text-xs text-tx/80 font-medium">'+escapeHtml(a.auteur||'Client')+tag+'</div></div>'+
        body+'</article>';
    }
    function avisBreakdown(stats){
      if(!stats||!stats.total)return '';
      const total=stats.total;
      const lines=[5,4,3,2,1].map(function(k){
        const n=Number(stats.breakdown&&stats.breakdown[k]||0);
        const pct=total>0?Math.round((n/total)*100):0;
        return '<div class="flex items-center gap-2 text-xs">'+
          '<span class="w-4 text-tx/80">'+k+'</span>'+
          '<i class="fa-solid fa-star text-accent text-[10px]"></i>'+
          '<div class="flex-1 h-1.5 rounded-full bg-brd overflow-hidden"><div class="h-full bg-accent" style="width:'+pct+'%"></div></div>'+
          '<span class="w-8 text-right text-muted">'+n+'</span></div>';
      }).join('');
      const moy=(Number(stats.moyenne||0)).toFixed(1).replace('.',',');
      return '<div class="rounded-2xl border border-brd bg-surface2 p-5 mb-6">'+
        '<div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6">'+
        '<div class="text-center sm:text-left"><div class="font-syne font-bold text-3xl text-accent leading-none">'+moy+'</div>'+
        '<div class="flex items-center gap-0.5 mt-1">'+starRow(Math.round(stats.moyenne||0))+'</div>'+
        '<div class="text-xs text-muted mt-1">'+total+' avis</div></div>'+
        '<div class="flex-1 w-full space-y-1.5">'+lines+'</div></div></div>';
    }
    async function loadAvisSection(prestataireId, container){
      try{
        const r=await fetch('/api/prestataires/'+prestataireId+'/avis',{headers:{Accept:'application/json'}});
        if(!r.ok)throw new Error('http');
        const d=await r.json();
        if(!d.ok)throw new Error('payload');
        const items=Array.isArray(d.avis)?d.avis:[];
        if(!items.length){
          container.innerHTML='<p class="text-sm text-muted">Aucun avis pour le moment. Soyez le premier à laisser un retour après une commande terminée.</p>';
          return;
        }
        container.innerHTML=avisBreakdown(d.stats)+'<div class="space-y-3">'+items.map(avisCard).join('')+'</div>';
      }catch(_e){
        container.innerHTML='<p class="text-sm text-muted">Impossible de charger les avis.</p>';
      }
    }
    function cvEmbedBlock(p){
      if(!p.has_cv||!p.cv_preview_url)return '<p class="text-xs text-muted">CV non disponible.</p>';
      const src=escapeHtml(p.cv_preview_url)+'&cb='+Date.now();
      return '<div class="rounded-2xl border border-accent/25 bg-bg overflow-hidden ring-1 ring-accent/10">'+
        '<div class="flex items-start gap-3 border-b border-brd bg-surface2 px-4 py-3 sm:px-5">'+
        '<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-accent/15 text-accent"><i class="fa-regular fa-file-pdf text-xl"></i></span>'+
        '<div class="min-w-0">'+
        '<h3 class="font-syne font-bold text-base text-tx">CV professionnel (PDF)</h3>'+
        '<p class="text-xs text-muted mt-1 leading-relaxed">Document <strong class="text-tx/90 font-medium">PDF</strong> fourni par le prestataire à l’inscription — affiché directement ci-dessous (pas un extrait de la biographie).</p>'+
        '</div></div>'+
        '<div class="p-2 sm:p-3">'+
        '<iframe src="'+src+'" title="CV du prestataire au format PDF" class="w-full h-[min(62vh,600px)] min-h-[260px] rounded-lg border border-brd bg-surface"></iframe>'+
        '</div>'+
        (p.cv_download_url?'<div class="border-t border-brd bg-surface2 px-4 py-2.5 text-right"><a href="'+escapeHtml(p.cv_download_url)+'" class="text-xs font-medium text-accent hover:underline">Télécharger le PDF</a></div>':'')+
        '</div>';
    }
    async function init(){
      const id=getId();if(!id)return;
      var bt=document.getElementById('back-teaser');
      if(bt)bt.href='/prestataires/'+id;
      const root=document.getElementById('root');
      const photoHtml=function(p){
        return p.photo_url
          ?'<img src="'+escapeHtml(p.photo_url)+'" alt="" class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl object-cover border-2 border-brd shrink-0 shadow-md"/>'
          :'<div class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl border-2 border-brd bg-accent/10 flex items-center justify-center font-syne font-bold text-2xl text-accent shrink-0">'+escapeHtml(initials(p.prenom,p.nom))+'</div>';
      };
      let r=await fetch('/api/client/prestataires/'+id,{credentials:'same-origin',headers:{Accept:'application/json'}});
      if(r.ok){
        document.getElementById('hdr-badge').textContent='Profil complet — client';
        const d=await r.json();
        if(!d.ok){root.innerHTML='<p class="text-sm text-muted">Profil introuvable.</p>';return;}
        const p=d.prestataire;
        const contact='<div class="rounded-2xl border border-brd bg-surface2 p-5 mb-8">'+
          '<h2 class="font-syne font-bold text-lg mb-4">Coordonnées</h2>'+
          '<dl class="space-y-3 text-sm">'+
          '<div><dt class="text-xs text-muted font-medium mb-0.5">Email</dt><dd><a class="text-accent hover:underline break-all" href="mailto:'+escapeHtml(p.email)+'">'+escapeHtml(p.email)+'</a></dd></div>'+
          '<div><dt class="text-xs text-muted font-medium mb-0.5">Téléphone</dt><dd><a class="text-accent hover:underline" href="tel:'+escapeHtml(String(p.telephone||'').replace(/\s/g,''))+'">'+escapeHtml(p.telephone||'')+'</a></dd></div>'+
          '</dl>'+
          '<div class="mt-5 pt-2 border-t border-brd/80">'+cvEmbedBlock(p)+'</div></div>';
        root.innerHTML=layoutHero(p,photoHtml(p))+contact+
          '<h2 class="font-syne font-bold text-xl mb-4">Services publiés</h2>'+
          '<div class="space-y-4 mb-10">'+serviceBlocks(d.services||[], { prestataireId: id, showMessage: true })+'</div>'+
          '<h2 class="font-syne font-bold text-xl mb-4">Avis des clients</h2>'+
          '<div id="avis-section" class="mb-8"><p class="text-sm text-muted">Chargement des avis…</p></div>';
        loadAvisSection(id, document.getElementById('avis-section'));
        return;
      }
      r=await fetch('/api/prestataires/'+id+'/public',{headers:{Accept:'application/json'}});
      document.getElementById('hdr-badge').textContent='Profil public';
      if(!r.ok){root.innerHTML='<p class="text-sm text-muted">Profil introuvable.</p>';return;}
      const d=await r.json();
      const p=d.prestataire;
      const hint=d.detail_hint||'Connectez-vous en tant que client pour afficher email, téléphone et CV.';
      const banner='<div class="rounded-xl border border-accent/30 bg-accent/5 px-4 py-3 text-sm text-tx/90 mb-6">'+
        escapeHtml(hint)+' <a href="/login" class="text-accent font-medium underline">Se connecter</a></div>';
      root.innerHTML=banner+layoutHero(p,photoHtml(p))+
        '<div class="rounded-xl border border-brd bg-surface2 p-4 mb-8 text-sm text-muted">Coordonnées et CV : réservés aux clients connectés.</div>'+
        '<h2 class="font-syne font-bold text-xl mb-4">Services publiés</h2>'+
        '<div class="space-y-4 mb-10">'+serviceBlocks(d.services||[], { prestataireId: id, showMessage: false })+'</div>'+
        '<h2 class="font-syne font-bold text-xl mb-4">Avis des clients</h2>'+
        '<div id="avis-section" class="mb-8"><p class="text-sm text-muted">Chargement des avis…</p></div>';
      loadAvisSection(id, document.getElementById('avis-section'));
    }
    document.addEventListener('DOMContentLoaded',init);
  </script>
</body>
</html>
